[project]
name = "taller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alexander", email = "bryanpilco.1597@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
